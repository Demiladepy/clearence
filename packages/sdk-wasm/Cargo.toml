[package]
name = "clearance-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Clearance crypto and Groth16 prover for the browser and Node (wasm-bindgen)"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
circuits = { workspace = true }
stellar-private-payments = { workspace = true, features = ["encrypted-storage"] }
taceo-poseidon2 = { workspace = true }
wasm-bindgen = { workspace = true }
num-bigint = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }

[lints]
workspace = true
